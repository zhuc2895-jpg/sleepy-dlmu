android.disallowKotlinSourceSets=false
# HTTP/HTTPS proxy (sandbox egress)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.local
# Memory constrained build (≈6GB RAM sandbox): shrink heaps, force single-thread D8
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true
kotlin.code.style=official
# AGP: full-classpath dexing reduces peak memory (avoids per-AAR transform temp DEX)
android.useFullClasspathForDexingTransform=true
# Single-thread D8 (no worker fork storm)
android.settings.forceDexingSingleThread=true
